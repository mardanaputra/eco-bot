<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Koding: Eco-Bot Penyelamat Lingkungan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0fdf4; }
        .block-code { background-color: #facc15; padding: 10px; border-radius: 8px; border: 2px solid #ca8a04; margin-bottom: 8px; font-weight: bold; }
        .block-wrapper { background-color: #eab308; padding: 15px; border-radius: 10px; }
        .conveyor-belt { background: repeating-linear-gradient(90deg, #52525b, #52525b 20px, #3f3f46 20px, #3f3f46 40px); border: 4px solid #27272a; border-radius: 4px;}
        .trash-item { transition: all 0.5s ease-in-out; }
        select { background-color: white; border: 1px solid #ccc; padding: 2px 5px; border-radius: 4px; font-weight: normal; margin: 0 4px; }
        .bin { transition: transform 0.2s; }
        .bin:hover { transform: scale(1.05); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-green-700 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">🤖 Eco-Bot: Penyelamat Lingkungan</h1>
            <p class="text-sm text-green-200">Belajar Logika If-Else & Perulangan</p>
        </div>
        <div class="flex gap-4 items-center">
            <div class="bg-green-800 px-4 py-2 rounded-lg">
                <span class="font-bold">Skor:</span> <span id="scoreDisplay">0</span>
            </div>
            <div class="bg-red-800 px-4 py-2 rounded-lg">
                <span class="font-bold">HP Kota:</span> <span id="hpDisplay">100</span>%
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: Logic Editor -->
        <div class="w-1/2 p-6 bg-white border-r-4 border-gray-200 overflow-y-auto">
            <div class="mb-6 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">💻 Workspace Kode</h2>
                <select id="levelSelector" class="bg-blue-100 border-blue-500 text-blue-800 p-2 font-bold rounded" onchange="changeLevel()">
                    <option value="1">Level 1: Pengenalan If-Else</option>
                    <option value="2">Level 2: Nested If-Else</option>
                    <option value="3">Level 3: Studi Kasus (Bug!)</option>
                </select>
            </div>

            <!-- Mission Description -->
            <div id="missionBox" class="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-500 mb-6 text-sm">
                <!-- Injected via JS -->
            </div>

            <!-- Block Editor Area -->
            <div class="block-wrapper" id="editorArea">
                <!-- Injected via JS -->
            </div>

            <button onclick="runSimulation()" class="mt-6 w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg flex items-center justify-center gap-2 text-lg transition-colors">
                ▶️ Jalankan Kode (Simulasi)
            </button>
            <button onclick="stopSimulation()" id="stopBtn" class="mt-2 w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg shadow-lg flex items-center justify-center gap-2 transition-colors hidden">
                ⏹ Hentikan
            </button>

            <div id="feedbackBox" class="mt-4 hidden p-4 rounded-lg font-bold text-center"></div>
        </div>

        <!-- Right Panel: Simulation Stage -->
        <div class="w-1/2 bg-gray-100 flex flex-col relative">
            <h2 class="text-center font-bold text-gray-600 py-2 border-b bg-gray-200">Pabrik Penyortiran Cyberville</h2>
            
            <div class="flex-1 relative flex flex-col justify-center items-center p-4">
                
                <!-- Conveyor Belt Area -->
                <div class="w-full max-w-md h-24 conveyor-belt relative flex items-center justify-center mb-12 shadow-xl">
                    <div id="spawnPoint" class="absolute left-[-20px] opacity-0 text-5xl z-10 trash-item">
                        <!-- Trash emoji injected here -->
                    </div>
                    <div id="scanner" class="absolute h-full w-24 bg-blue-400/30 border-2 border-blue-500 rounded flex flex-col items-center justify-start text-xs text-blue-900 font-bold">
                        <span class="bg-blue-100 px-1 rounded mt-1">SCANNER</span>
                    </div>
                </div>

                <!-- Bins -->
                <div class="flex gap-8 mt-12 w-full justify-center">
                    <div class="bin flex flex-col items-center">
                        <div class="w-24 h-32 bg-green-500 border-4 border-green-700 rounded-t-lg shadow-lg flex items-center justify-center text-4xl" id="bin-hijau">♻️</div>
                        <div class="bg-gray-800 text-white text-xs px-2 py-1 mt-2 rounded font-bold">TONG HIJAU (Organik)</div>
                    </div>
                    <div class="bin flex flex-col items-center">
                        <div class="w-24 h-32 bg-yellow-400 border-4 border-yellow-600 rounded-t-lg shadow-lg flex items-center justify-center text-4xl" id="bin-kuning">♻️</div>
                        <div class="bg-gray-800 text-white text-xs px-2 py-1 mt-2 rounded font-bold">TONG KUNING (Anorganik)</div>
                    </div>
                    <div class="bin flex flex-col items-center opacity-50 transition-opacity" id="bin-merah-container">
                        <div class="w-24 h-32 bg-red-500 border-4 border-red-700 rounded-t-lg shadow-lg flex items-center justify-center text-4xl" id="bin-merah">☢️</div>
                        <div class="bg-gray-800 text-white text-xs px-2 py-1 mt-2 rounded font-bold">TONG MERAH (B3)</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Game Data
        let score = 0;
        let hp = 100;
        let currentLevel = 1;
        let isSimulating = false;
        let simulationInterval;
        let currentTrashIndex = 0;
        let trashQueue = [];

        const trashDb = [
            { type: 'Organik', name: 'Daun', icon: '🍃', target: 'hijau' },
            { type: 'Organik', name: 'Sisa Apel', icon: '🍎', target: 'hijau' },
            { type: 'Anorganik', name: 'Botol Plastik', icon: '🍼', target: 'kuning' },
            { type: 'Anorganik', name: 'Kaleng', icon: '🥫', target: 'kuning' },
            { type: 'B3', name: 'Baterai Bekas', icon: '🔋', target: 'merah' },
            { type: 'Lainnya', name: 'Sepatu Bekas', icon: '👞', target: 'lewat' }
        ];

        const levelConfigs = {
            1: {
                mission: "<strong>Misi Level 1:</strong> Ada 2 jenis sampah (Organik & Anorganik). Gunakan blok If-Else tunggal. Jika Organik -> Tong Hijau, selebihnya -> Tong Kuning.",
                trashTypes: ['Organik', 'Anorganik'],
                queueSize: 5
            },
            2: {
                mission: "<strong>Misi Level 2:</strong> Waspada Baterai! Ada 3 jenis sampah sekarang (Organik, Anorganik, B3). Gunakan If-Else bersarang (Nested).",
                trashTypes: ['Organik', 'Anorganik', 'B3'],
                queueSize: 7
            },
            3: {
                mission: "<strong>🚨 KASUS (PBL):</strong> Kode Level 2 bermasalah! Ada 'Sepatu Bekas' (Bukan Organik/Anorganik/B3) masuk ke conveyor. Jika kode-mu salah, Sepatu akan masuk ke Tong Merah dan merusak mesin! Abaikan sampah tak dikenal.",
                trashTypes: ['Organik', 'Anorganik', 'B3', 'Lainnya'],
                queueSize: 8
            }
        };

        // DOM Elements
        const editorArea = document.getElementById('editorArea');
        const missionBox = document.getElementById('missionBox');
        const levelSelector = document.getElementById('levelSelector');
        const binMerahContainer = document.getElementById('bin-merah-container');
        const spawnPoint = document.getElementById('spawnPoint');
        const feedbackBox = document.getElementById('feedbackBox');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const hpDisplay = document.getElementById('hpDisplay');

        // Initialization
        window.onload = () => {
            changeLevel();
        };

        function changeLevel() {
            currentLevel = parseInt(levelSelector.value);
            const config = levelConfigs[currentLevel];
            missionBox.innerHTML = config.mission;
            
            // Adjust visual bins
            if(currentLevel === 1) {
                binMerahContainer.classList.add('opacity-30');
            } else {
                binMerahContainer.classList.remove('opacity-30');
            }

            renderBlocks(currentLevel);
            stopSimulation();
            resetStage();
        }

        function renderBlocks(level) {
            let html = `<div class="bg-gray-100 p-2 rounded mb-2 font-mono text-sm text-gray-700">when [Green Flag] clicked<br>repeat (selamanya)</div>`;
            
            if (level === 1) {
                html += `
                <div class="block-code">
                    if (sampah = 
                    <select id="cond1">
                        <option value="Organik">Organik</option>
                        <option value="Anorganik">Anorganik</option>
                        <option value="B3">B3</option>
                    </select>) then
                    <div class="ml-4 mt-2">
                        broadcast <select id="act1">
                            <option value="hijau">Buang ke Tong Hijau</option>
                            <option value="kuning">Buang ke Tong Kuning</option>
                            <option value="merah">Buang ke Tong Merah</option>
                            <option value="lewat">Biarkan Lewat</option>
                        </select>
                    </div>
                </div>
                <div class="block-code">
                    else
                    <div class="ml-4 mt-2">
                        broadcast <select id="act2">
                            <option value="kuning" selected>Buang ke Tong Kuning</option>
                            <option value="hijau">Buang ke Tong Hijau</option>
                            <option value="merah">Buang ke Tong Merah</option>
                            <option value="lewat">Biarkan Lewat</option>
                        </select>
                    </div>
                </div>`;
            } 
            else if (level === 2 || level === 3) {
                html += `
                <div class="block-code">
                    if (sampah = 
                    <select id="cond1">
                        <option value="Organik">Organik</option>
                        <option value="Anorganik">Anorganik</option>
                        <option value="B3">B3</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>) then
                    <div class="ml-4 mt-2">
                        broadcast <select id="act1">
                            <option value="hijau">Buang ke Tong Hijau</option>
                            <option value="kuning">Buang ke Tong Kuning</option>
                            <option value="merah">Buang ke Tong Merah</option>
                            <option value="lewat">Biarkan Lewat</option>
                        </select>
                    </div>
                </div>
                <div class="block-code">
                    else
                    <div class="ml-4 mt-2 border-l-2 border-yellow-800 pl-2">
                        if (sampah = 
                        <select id="cond2">
                            <option value="Anorganik">Anorganik</option>
                            <option value="Organik">Organik</option>
                            <option value="B3">B3</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>) then
                        <div class="ml-4 mt-2">
                            broadcast <select id="act2">
                                <option value="kuning">Buang ke Tong Kuning</option>
                                <option value="hijau">Buang ke Tong Hijau</option>
                                <option value="merah">Buang ke Tong Merah</option>
                                <option value="lewat">Biarkan Lewat</option>
                            </select>
                        </div>
                        
                        <div class="mt-2">
                            else (jika bukan keduanya)
                            <div class="ml-4 mt-2">
                                broadcast <select id="act3">
                                    <option value="merah" ${level==2 ? 'selected' : ''}>Buang ke Tong Merah</option>
                                    <option value="kuning">Buang ke Tong Kuning</option>
                                    <option value="hijau">Buang ke Tong Hijau</option>
                                    <option value="lewat">Biarkan Lewat</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>`;
                
                if (level === 3) {
                    html += `<p class="mt-4 text-sm text-red-900 font-bold animate-pulse">⚠️ Hint PBL: Tambahkan logika baru di pikiranmu! Jika Else terakhir langsung membuang ke Tong Merah, apa yang terjadi jika ada Sepatu (Lainnya) masuk?</p>`
                }
            }

            html += `<div class="bg-gray-100 p-2 rounded mt-2 font-mono text-sm text-gray-700">end loop</div>`;
            editorArea.innerHTML = html;
        }

        function generateTrashQueue(level) {
            const types = levelConfigs[level].trashTypes;
            const size = levelConfigs[level].queueSize;
            let queue = [];
            for(let i=0; i<size; i++) {
                // Pick random allowed type
                let randType = types[Math.floor(Math.random() * types.length)];
                // If level 3, guarantee at least 2 "Lainnya" (Bug scenario)
                if(level === 3 && i >= size - 2) randType = 'Lainnya'; 
                
                const possibleTrash = trashDb.filter(t => t.type === randType);
                const t = possibleTrash[Math.floor(Math.random() * possibleTrash.length)];
                queue.push(t);
            }
            // Shuffle queue slightly
            return queue.sort(() => Math.random() - 0.5);
        }

        function getUserLogic() {
            let logic = {};
            logic.cond1 = document.getElementById('cond1')?.value;
            logic.act1 = document.getElementById('act1')?.value;
            logic.act2 = document.getElementById('act2')?.value;
            
            if (currentLevel >= 2) {
                logic.cond2 = document.getElementById('cond2')?.value;
                logic.act3 = document.getElementById('act3')?.value;
            }
            return logic;
        }

        function evaluateTrashLogic(trash, logic) {
            if (currentLevel === 1) {
                if (trash.type === logic.cond1) return logic.act1;
                else return logic.act2;
            } else {
                if (trash.type === logic.cond1) return logic.act1;
                else if (trash.type === logic.cond2) return logic.act2;
                else return logic.act3; // The trap in Level 3!
            }
        }

        function runSimulation() {
            if(isSimulating) return;
            
            isSimulating = true;
            document.getElementById('stopBtn').classList.remove('hidden');
            feedbackBox.classList.add('hidden');
            trashQueue = generateTrashQueue(currentLevel);
            currentTrashIndex = 0;
            
            processNextTrash();
        }

        function stopSimulation() {
            isSimulating = false;
            document.getElementById('stopBtn').classList.add('hidden');
            spawnPoint.style.opacity = 0;
            spawnPoint.style.transform = 'translate(0px, 0px)';
        }

        function resetStage() {
            spawnPoint.style.opacity = 0;
            spawnPoint.style.transform = 'translate(0px, 0px)';
            feedbackBox.classList.add('hidden');
        }

        function showFeedback(msg, isSuccess) {
            feedbackBox.innerHTML = msg;
            feedbackBox.className = `mt-4 p-4 rounded-lg font-bold text-center ${isSuccess ? 'bg-green-100 text-green-800 border-2 border-green-500' : 'bg-red-100 text-red-800 border-2 border-red-500'}`;
            feedbackBox.classList.remove('hidden');
        }

        function processNextTrash() {
            if(!isSimulating) return;

            if(currentTrashIndex >= trashQueue.length) {
                stopSimulation();
                if (hp > 0) showFeedback("🎉 Simulasi Selesai! Kode berjalan baik.", true);
                else showFeedback("💀 Simulasi Gagal! Kota dipenuhi polusi. Coba perbaiki logikanya.", false);
                return;
            }

            const currentTrash = trashQueue[currentTrashIndex];
            const userLogic = getUserLogic();
            const robotDecision = evaluateTrashLogic(currentTrash, userLogic);

            // Animation Sequence
            spawnPoint.innerHTML = currentTrash.icon;
            spawnPoint.style.transition = 'none';
            spawnPoint.style.opacity = 1;
            spawnPoint.style.transform = 'translate(-50px, 0px)'; // Start position

            // 1. Move to scanner
            setTimeout(() => {
                spawnPoint.style.transition = 'all 1s linear';
                spawnPoint.style.transform = 'translate(180px, 0px)'; // Middle scanner
            }, 50);

            // 2. Evaluate & Move to Bin
            setTimeout(() => {
                let targetX, targetY = 120;
                let isCorrect = false;

                // Checking logic correctness based on game rules
                if (robotDecision === 'hijau') targetX = 0;
                else if (robotDecision === 'kuning') targetX = 130;
                else if (robotDecision === 'merah') targetX = 260;
                else { targetX = 400; targetY = 0; } // Biarkan lewat

                // Correctness logic
                if (currentTrash.type === 'Organik' && robotDecision === 'hijau') isCorrect = true;
                else if (currentTrash.type === 'Anorganik' && robotDecision === 'kuning') isCorrect = true;
                else if (currentTrash.type === 'B3' && robotDecision === 'merah') isCorrect = true;
                else if (currentTrash.type === 'Lainnya' && robotDecision === 'lewat') isCorrect = true;

                // PBL Bug Check specific
                if (currentLevel === 3 && currentTrash.type === 'Lainnya' && robotDecision === 'merah') {
                    showFeedback(`🚨 BUG TERJADI! ${currentTrash.name} masuk ke Tong Merah (B3)! Mesin Rusak! Coba ubah 'else terakhir' menjadi 'Biarkan Lewat'.`, false);
                    isCorrect = false;
                    hp -= 20;
                } else if (!isCorrect) {
                    hp -= 10;
                } else {
                    score += 10;
                }

                // Update UI
                hpDisplay.innerText = hp;
                scoreDisplay.innerText = score;
                if(hp <= 0) hp = 0;

                // Execute move
                spawnPoint.style.transition = 'all 0.8s ease-in';
                spawnPoint.style.transform = `translate(${180 + targetX - 130}px, ${targetY}px)`; // Relative positioning approx

                // Next iteration
                setTimeout(() => {
                    spawnPoint.style.opacity = 0;
                    currentTrashIndex++;
                    if(hp > 0) processNextTrash();
                    else {
                        stopSimulation();
                        showFeedback("💀 GAME OVER! HP Kota habis karena kode yang salah.", false);
                    }
                }, 1000);

            }, 1200); // Time spent waiting at scanner
        }
    </script>
</body>
</html>
